version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: petmarket_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: petmarket_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build: .
    container_name: petmarket_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=mysql_db
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=petmarket_db
    depends_on:
      - mysql_db

volumes:
  mysql_data:
